name: dockerfile
run-name: run dockerfile
on: [push]
jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: cloning repo onto the runner's vm workspace folder
        uses: actions/checkout@v7
      - run: docker build -t dk .
      - run: docker run --detach --name dk-container --publish 8080:90 dk 
      - run: sleep 3 && curl --fail http://localhost:8080/hello
  